<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AI 群聊</title>
  <!--OPS:TOKEN-->
  <link id="hljs-theme" rel="stylesheet" href="/vendor/hljs-github-dark.min.css">
  <link rel="stylesheet" href="/css/chat.css">
  <link rel="stylesheet" href="/css/members.css">
  <link rel="stylesheet" href="/css/secrets.css">
  <link rel="stylesheet" href="/css/installer.css">
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
</head>
<body>

<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<div id="sidebar">
  <div class="sidebar-header">
    <span>📋 历史会话</span>
    <button onclick="toggleSidebar()">✕</button>
  </div>
  <div id="history-list"></div>
  <div class="sidebar-footer">
    <button onclick="newSession()">+ 新建会话</button>
    <button onclick="exportSession()" title="导出当前会话为 Markdown">⬇ 导出</button>
  </div>
</div>

<div id="main">
  <header>
    <div class="logo">
      <span class="logo-icon" onclick="toggleSidebar()">☰</span>
      <span class="logo-icon" onclick="toggleTheme()" title="切换主题">🌓</span>
      <span id="logo-text">🤖 AI 群聊</span>
    </div>
    <div class="controls">
      <button id="members-btn" onclick="Members.open()" title="维护群成员与模型">👥 成员</button>
      <button id="secrets-btn" onclick="Secrets.open()" title="管理本地 API Key">🔑 Key</button>
      <div class="selector">
        <label>🔀</label>
        <select id="mode-select" onchange="changeMode(this.value)">
          <option value="parallel">并行</option>
          <option value="collaborate">协作</option>
        </select>
      </div>
      <div class="selector">
        <label>🧠</label>
        <select id="thinking-mode" onchange="changeThinking(this.value)">
          <option value="off">关闭</option>
          <option value="low">低</option>
          <option value="medium">中</option>
          <option value="high">高</option>
          <option value="max">最大</option>
        </select>
      </div>
      <div class="selector">
        <label>🔁</label>
        <select id="rounds-select" onchange="changeRounds(this.value)">
          <option value="1">1 轮</option>
          <option value="2">2 轮</option>
          <option value="3">3 轮</option>
          <option value="4">4 轮</option>
          <option value="5">5 轮</option>
        </select>
      </div>
      <div id="agent-toggles" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
  </header>

  <!-- 注意：不要预置空的 #welcome 占位 div，否则 showWelcome() 会因检测到已存在而跳过渲染 -->
  <div id="messages"></div>

  <div class="input-bar">
    <div class="status-bar" id="status-bar"></div>
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="输入消息… @ 可定向发言，Shift+Enter 换行"></textarea>
      <button id="send" onclick="sendMessage()">发送</button>
      <button id="stop" onclick="stopGeneration()">⏹ 停止</button>
      <button id="regen" onclick="regenerateLast()" title="按原始输入重新生成最后一轮回复">🔄</button>
    </div>
  </div>
</div>

<div id="members-overlay" class="hidden">
  <div id="members-panel">
    <div class="members-head">
      <span>👥 群成员与模型维护</span>
      <button onclick="Members.close()">✕</button>
    </div>
    <div id="members-list"></div>
    <div class="members-add">
      <h3>添加自定义成员</h3>
      <div class="members-add-grid">
        <input id="m-add-key" placeholder="key（如 my-ai）">
        <input id="m-add-name" placeholder="成员名（如 My AI）">
        <input id="m-add-command" placeholder="CLI 命令（如 myai）">
        <input id="m-add-args" placeholder="args 逗号分隔（如 -p,{prompt}）">
        <input id="m-add-role" placeholder="角色说明">
        <input id="m-add-model" placeholder="默认模型">
        <input id="m-add-models" placeholder="可选模型，逗号分隔">
        <select id="m-add-parse">
          <option value="text">text</option>
          <option value="ndjson">ndjson</option>
          <option value="json-envelope">json-envelope</option>
        </select>
      </div>
      <button class="btn-primary" onclick="Members.add()">添加成员</button>
    </div>
  </div>
</div>

<div id="secrets-overlay" class="hidden">
  <div id="secrets-panel">
    <div class="secrets-head">
      <span>🔑 本地 API Key 管理</span>
      <button onclick="Secrets.close()">✕</button>
    </div>
    <div class="secrets-desc">仅管理群聊成员 / 自定义 CLI 的本机 Key；DeepSeek 护航 Key 存于 macOS 钥匙串，不在此处。</div>
    <div class="secrets-path" id="secrets-path"></div>
    <div id="secrets-list"></div>
    <div class="secrets-actions">
      <button class="btn-primary" onclick="Secrets.save()">保存</button>
      <button class="toggle" onclick="Secrets.addRow()">+ 添加一行</button>
      <span class="secrets-hint">保存后写入 <b>~/.secrets.env</b> 并立即生效；重启服务后会自动加载（不覆盖启动时已设置的同名变量）</span>
    </div>
  </div>
</div>
<div id="mention-popup"></div>

<script src="/js/ops.js"></script>
<script src="/js/installer.js"></script>
<script src="/js/chat.js"></script>
  <script src="/js/members.js"></script>
  <script src="/js/secrets.js"></script>

</body>
</html>
